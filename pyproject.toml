[project]
name = "koth-rust"
version = "0.1.0"
description = "Development shell for the koth_ff Rust workspace and its Python bindings"
readme = "README.md"
# Dev shell only — the published koth-ff package targets >=3.10, but
# numpy>=2.4.3 used by the plotting scripts requires >=3.11.
requires-python = ">=3.11"
dependencies = [
    "koth-ff",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "polars>=1.0",
    "scipy>=1.17.1",
]

[dependency-groups]
# `uv sync` installs these into the dev shell so `just dev-py` (and any other
# in-place rebuild via `maturin develop`) works without a global install.
dev = ["maturin>=1.4,<2"]

[tool.uv.sources]
koth-ff = { path = "koth_ff_py" }
