[project]
name = "koth-rust"
version = "0.1.0"
description = "Development shell for the koth_ff Rust workspace's analysis scripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=4.1.0",
    "fastparquet>=2026.3.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "plotly>=6.7.0",
    "polars>=1.0",
    "pyarrow>=24.0.0",
    "scipy>=1.17.1",
]
