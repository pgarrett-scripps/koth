[workspace]
members = ["koth_ff"]
resolver = "2"

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"
license      = "MIT"
repository   = "https://github.com/tacular-omics/koth_rust"

[workspace.dependencies]
mzdata    = { version = "0.63", default-features = false, features = ["mzml", "mgf", "miniz_oxide", "nalgebra"] }
timsrust  = { version = "0.4" }
rayon     = "1.10"
csv       = "1.3"
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml      = "0.8"
log       = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow    = "1.0"
clap      = { version = "4", features = ["derive"] }
arrow     = { version = "53", features = ["ipc"] }
parquet   = { version = "53", features = ["arrow"] }
rand      = "0.8"
