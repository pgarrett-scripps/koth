[package]
name = "koth_ff"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "koth_ff"
path = "src/main.rs"

[lib]
name = "koth_ff"
path = "src/lib.rs"

[dependencies]
mzdata = { version = "0.63", default-features = false, features = ["mzml", "mgf", "miniz_oxide"] }
timsrust = { version = "0.4", optional = true }
rayon = "1.10"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }

[features]
default = ["tdf"]
tdf = ["timsrust"]
