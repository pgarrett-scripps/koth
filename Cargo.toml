[workspace]
members = ["koth_ff"]
resolver = "2"

[workspace.package]
version      = "0.10.0"
edition      = "2021"
rust-version = "1.88"
license      = "MIT"
repository   = "https://github.com/pgarrett-scripps/koth_rust"

[workspace.dependencies]
mzdata    = { version = "0.63", default-features = false, features = ["mzml", "mgf", "miniz_oxide", "nalgebra"] }
timsrust  = { version = "0.4" }
rayon     = "1.10"
csv       = "1.3"
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml      = "0.8"
log       = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow    = "1.0"
clap      = { version = "4", features = ["derive"] }
arrow     = { version = "53", features = ["ipc"] }
parquet   = { version = "53", features = ["arrow"] }
rand      = "0.8"

[workspace.lints.clippy]
# Index-based loops are often clearer in the numerical kernels, and several
# hot-path APIs intentionally pass their reusable scratch buffers separately.
needless_range_loop = "allow"
too_many_arguments = "allow"
# Tests commonly start from production defaults and change only the value under
# test; spelling every unrelated field in a struct update is less readable.
field_reassign_with_default = "allow"
# Existing format strings intentionally keep arguments visually aligned in
# long diagnostic tables; this style is stable and harmless.
uninlined_format_args = "allow"
