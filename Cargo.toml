[workspace]
members = ["koth_ff", "koth_ff_py"]
resolver = "2"

[workspace.dependencies]
mzdata    = { version = "0.63", default-features = false, features = ["mzml", "mgf", "miniz_oxide"] }
timsrust  = { version = "0.4" }
rayon     = "1.10"
csv       = "1.3"
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml      = "0.8"
log       = "0.4"
env_logger = "0.11"
thiserror = "1.0"
anyhow    = "1.0"
clap      = { version = "4", features = ["derive"] }
pyo3      = { version = "0.28", features = ["extension-module"] }
