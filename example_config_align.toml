# koth_align configuration
# All values shown are defaults. Modify as needed.
# Usage: koth_align <batch_dir> --config example_config_align.toml
#
# <batch_dir> must contain one subdirectory per run, each with:
#   hills.{tsv,parquet} and features.{tsv,parquet}
#
# Feature quality is carried as three separate scores (each in [0, 1]):
#   - isotope_score  : Bhattacharyya isotope-pattern match (vs averagine)
#   - cosine_score   : mean chromatographic cosine between isotope hills
#                      (time-domain co-elution — set in feature finding,
#                      gated per-extension by `min_chain_cosine` there)
#   - combined_score : isotope_score × cosine_score (default quality knob)
#
# Alignment, consensus grouping, and seed selection all filter on
# `combined_score`. Independent isotope/cosine filtering is available at the
# feature-finding stage via `min_isotope_score` / `min_cosine_score` /
# `min_combined_score` in [features] of the upstream koth_ff config.
#
# LFQ recomputes extraction quality for direct and MBR cells:
#   - spectral_bhattacharyya : isotope-pattern agreement
#   - coelution : inter-isotope chromatographic cosine
#   - hybrid_score : (rt × intensity × pattern × coelution)^(1/4)

# ── Alignment ──────────────────────────────────────────────────────────────────
[alignment]

# Optional exact run-directory name. Omit for automatic reference selection.
# reference_run = "run_01"

# PPM tolerance for finding anchor feature pairs between runs
anchor_mass_ppm = 10.0

# Normalised RT window [0, 1] for anchor matching (0.05 = ±5% of gradient)
rt_anchor_window = 0.05

# Ion mobility tolerance for anchor matching (1/K0 units)
im_tolerance = 0.05

# Minimum `combined_score` (isotope × chromatographic cosine) for a feature
# to be eligible as an alignment anchor. Anchors are the highest-quality
# features; stricter = cleaner warp fit, fewer anchors.
min_anchor_combined_score = 0.5

# Minimum anchor count required to fit a warp.
# Runs below this fall back to an identity (no-warp) correction.
min_anchor_count = 10

# Bandwidth of the sliding-window median for RT warp fitting,
# as a fraction of the normalised RT range [0, 1].
# Larger = smoother warp curve; smaller = more local correction.
rt_warp_bandwidth = 0.1

# Warp model. "ransac" is the only supported value.
rt_warp_kind = "ransac"

# RANSAC inlier half-band in normalised RT units (0.01 ≈ 1.4 min on a
# 142-min gradient).
rt_warp_ransac_thresh = 0.01

# ── LFQ ───────────────────────────────────────────────────────────────────────
[lfq]

# m/z tolerance for finding matching hills in each run (ppm)
mz_ppm = 10.0

# Half-window for XIC grid extraction as a fraction of the run's RT span.
# 0.005 = ±0.5% of the observed run span, centred at the predicted native RT.
# On a 142-minute run this is ±42.6 seconds (1% total window).
rt_window_pct = 0.005

# Absolute ion mobility half-window for hill matching in LFQ (1/K0 units).
# This is not a relative percentage; it is inert on inputs without mobility.
im_tolerance = 0.015

# Number of isotopologue rows in the XIC grid: 1 = M only, 2 = M+M1, 3 = M+M1+M2
n_isotopes = 3

# Number of RT bins per grid (default 100)
grid_cols = 100

# Minimum spectral Bhattacharyya for peak expansion; columns below this don't
# extend the peak. (Observed vs theoretical isotope pattern at the apex, [0, 1].
# NOT a cosine — the isotope co-elution cosine is a separate, always-on signal.)
min_spectral_bhattacharyya = 0.1

# Peak scoring mode: "hybrid" (default), "rt", "intensity", or "spectral"
score_mode = "hybrid"

# Run target-decoy competition to compute per-cell MBR q-values. When on, MBR
# q-values come from a semi-supervised QDA rescorer over {|ppm|, |RT diff|,
# Bhattacharyya, coelution} (Percolator-style loop + 3-fold CV): every cell with
# signal — detected or match-between-runs — competes against the decoys, so a
# background-contaminated detected cell in a depleted well is still gatable.
run_tdc = true

# Experimental (default off): replace the raw RT-closeness term with a
# region-aware, σ-normalised Gaussian RT likelihood from the per-run post-warp
# RT-residual spread.
rt_spread_scoring = false

# Experimental (default off): project each column onto the averagine
# envelope before scoring.
averagine_projection = false

# Cross-run matrix normalisation: "none" or "median_ratios" (DESeq-style size
# factors). "none" when a downstream pipeline normalises for you.
normalize = "none"

# Per-cell intensity estimator over the integrated grid peak: "sum" or "apex".
quant_estimator = "sum"

# Quantify EVERY consensus cell (detected and match-between-runs alike) by the
# same grid re-integration so the whole matrix sits on one intensity scale.
# Set false only to reproduce older mixed-scale matrices that trusted the
# per-run feature's own intensity for detected cells.
detected_use_grid = true

# Score the decoy against an averagine template computed from its OWN shifted
# mass rather than the target's, so a mis-massed decoy gets no free
# target-template match.
decoy_own_template = true

# Co-elution value for a grid cell with fewer than two isotope rows carrying
# signal (a lone monoisotope — nothing to co-elute). Applied identically to
# target and decoy cells. 0.5 is neutral; 1.0 hands lone-hill decoys a free
# target-like score.
lone_coelution = 0.5

# Which analyte class's average composition the LFQ isotope templates are built
# from: "peptide" (default), "rna", "dna", or an explicit composition table.
# Must match the `[features] isotope_model` the per-run features were detected
# with, or consensus cells are scored against a pattern the detector never used.
isotope_model = "peptide"

# Decoy m/z shift in Da. The decoy grid is centred at
#   decoy_mz = target_mz + decoy_mz_shift_da / charge.
# Pick a value large enough to clear the target's isotope envelope and any
# nearby adducts. 11 Da is the historical default and is safely off-pattern.
decoy_mz_shift_da = 11.0

# Decoy RT shift, as a fraction of the run's RT span. The decoy grid is
# centred at decoy_rt = target_rt − decoy_rt_shift_pct · rt_span.
# With the default 0.01 and `rt_window_pct = 0.005`, the two RT windows meet
# at one boundary. A shift greater than 2 × `rt_window_pct` separates them.
decoy_rt_shift_pct = 0.01

# ── Consensus grouping ────────────────────────────────────────────────────────
# Builds the multi-run consensus feature list with independent full-span
# tolerances. The three quality filters below run at different points in the
# pipeline — see the comments.
[lfq.consensus]

# Full coordinate-span limits for candidate grouping.
mz_ppm = 20.0
rt_window_pct = 0.02
im_tolerance = 0.05
# Experimental permuted-RT group confidence, separate from per-cell LFQ q-values.
# Ten independent controls preserve RT density within run/charge/quality strata.
# Replaces member/seed floors, min_group_size, and allow_replicated_weak_seeds.
# Groups need two original runs; 1.0 retains all replicated candidates for audit.
max_group_qvalue = 0.05

[output]

# Versioned bundle with original observations, LFQ cells and source hashes.
export_long = false

# Output format for consensus_features and intensity_matrix: "tsv" or "parquet"
format = "tsv"

# Maximum q-value to report in the intensity matrix (1.0 = report all entries).
# Set to 0.01 to keep only entries passing 1% FDR.
max_qvalue = 1.0

# Write `decoy_intensity_matrix.tsv` — wide-format decoy LFQ values mirroring
# `intensity_matrix.tsv`. Useful for FDR sanity-checks. Has no effect when
# `lfq.run_tdc = false`.
export_decoys = true

# Write `lfq_details.tsv` — long-format file with one row per
# (consensus feature, run, target/decoy pass) containing:
#   intensity, hybrid_score, cosine_score, n_isotopes_found,
#   expected_rt, apex_rt, rt_diff, peak_width_rt,
#   observed_mz, ppm_error, observed_im, im_delta, q_value.
# Recommended for QC / plotting; ~2 × n_features × n_runs rows when TDC is on.
export_details = true
