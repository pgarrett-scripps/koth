name: Release

# Publishing a GitHub Release is the only publication trigger.
# Manual runs exercise CI and packaging but publish nothing.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify release identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/release-requirements.txt
      - run: cffconvert --validate
      - run: python scripts/check_release.py
      - name: Check published release matches this package
        if: github.event_name == 'release'
        run: python scripts/check_release.py --event "$GITHUB_EVENT_PATH"
      - name: Check crate publishing credential is configured
        if: github.event_name == 'release'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "Configure the CARGO_REGISTRY_TOKEN repository secret before releasing." >&2
            exit 1
          fi

  ci:
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p koth-ms --bins
      - name: Package binaries and documentation
        shell: bash
        run: python scripts/package_release.py --target "${{ matrix.target }}" --output "$RUNNER_TEMP/koth-dist"
      - uses: actions/upload-artifact@v4
        with:
          name: koth-${{ matrix.target }}
          path: ${{ runner.temp }}/koth-dist/*
          if-no-files-found: error

  package:
    name: Verify crate package
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run --locked -p koth-ms

  publish:
    name: Attach binaries and publish crate
    needs: [build, package]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: koth-*
          path: ${{ runner.temp }}/koth-dist
          merge-multiple: true
      - name: Verify all four archives and checksums
        run: python scripts/package_release.py --verify --output "$RUNNER_TEMP/koth-dist"
      - name: Attach downloads to the release that triggered this run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/koth-dist"/* --clobber
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p koth-ms
      - name: Record Zenodo follow-up
        run: |
          echo 'Zenodo archives this published release through its GitHub integration.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Check the repository on https://zenodo.org/account/settings/github/ for the DOI or any archival error.' >> "$GITHUB_STEP_SUMMARY"
