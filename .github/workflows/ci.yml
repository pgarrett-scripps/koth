name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    name: Citation and documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/release-requirements.txt
      - run: cffconvert --validate
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -p 'test_release*.py'

  quality:
    name: Format, lint, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - run: cargo check -p koth-ms --locked --no-default-features --features tdf

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: [default, no-default]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.features }}
      - name: Test default features
        if: matrix.features == 'default'
        run: cargo test --workspace --locked
      - name: Test without default features
        if: matrix.features == 'no-default'
        run: cargo test --workspace --locked --no-default-features
