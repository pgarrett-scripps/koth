name: Publish Python wheels to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # allow manual trigger

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 — builds inside manylinux container automatically
          - os: ubuntu-latest
            target: x86_64
          # Linux aarch64 (cross-compile)
          - os: ubuntu-latest
            target: aarch64
          # macOS Intel
          - os: macos-latest
            target: x86_64
          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64
          # Windows x86_64
          - os: windows-latest
            target: x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          # point maturin at the koth_ff_py sub-crate
          manifest-path: koth_ff_py/Cargo.toml
          # use manylinux for broad Linux compatibility
          manylinux: auto

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/

  # Build a pure-Python sdist fallback
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
          manifest-path: koth_ff_py/Cargo.toml
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, sdist]
    # PyPI trusted publishing — no token needed; configure OIDC in your PyPI project settings
    # under Settings → Publishing → Add a new publisher → GitHub Actions
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
