[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "koth-ff"
version = "0.1.0"
description = "High-performance LC-MS feature finder for timsTOF and mzML data"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Patrick Garrett", email = "pgarrett@scripps.edu" }]
dependencies = [
    "polars>=1.0",
]
keywords = ["mass-spectrometry", "proteomics", "lc-ms", "timstof"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage   = "https://github.com/tacular-omics/koth_rust"
Repository = "https://github.com/tacular-omics/koth_rust"
Issues     = "https://github.com/tacular-omics/koth_rust/issues"

[tool.maturin]
# The native extension will be importable as koth_ff (the module declared in lib.rs)
manifest-path = "Cargo.toml"
python-source = "python"
