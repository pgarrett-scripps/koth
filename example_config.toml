# koth_ff example configuration
# All values shown are defaults. Uncomment and modify as needed.
# Usage: koth_ff <input> --config example_config.toml
[output]
format = "tsv"

[file]
# m/z tolerance — used by both hill detection and feature finding
mz_tolerance = 8.0
# "ppm" or "da"
mz_tolerance_type = "ppm"

# Ion mobility tolerance — used by both hill detection and feature finding
im_tolerance = 0.05
# "relative" (fraction of IM value) or "absolute" (1/K0 units)
im_tolerance_type = "relative"

# Restrict processing to this m/z window. Both are optional — omit to apply no
# bound. Defaults: global_min_mz = 0.0, global_max_mz = +inf (no upper limit).
# global_min_mz = 0.0
# global_max_mz = inf

# Fraction of total hill intensity to retain (1.0 = keep all scans)
intensity_coverage = 1.0

# Number of threads (omit or set to 0 to use all available CPUs)
# n_threads = 8

# Bruker .d centroiding parameters
bruker_mz_ppm = 5.0
bruker_im_pct = 3.0
# Minimum raw subpeaks required to emit a centroided peak (1 = keep all, 2+ filters noise)
bruker_min_subpeaks = 1

# Raw-cloud smoothing in TOF/scan-index space, applied before m/z and 1/K0
# conversion. Half-window units; full window = 2*N + 1. Real signal clusters
# along these axes and reinforces under the rolling average; random noise gets
# dispersed. Set to 0 to disable a given axis.
bruker_im_smoothing_window = 2   # scan-index axis (full window 5)
bruker_mz_smoothing_window = 1   # TOF-index axis  (full window 3)

# Satellite-peak suppression: after each centroid is emitted, raw peaks within
# +/- bruker_satellite_window_da of the centroid that fall under a linear ramp
# starting at the anchor's raw intensity (d=0) and ending at
# anchor * bruker_satellite_end_fraction (d=window) are marked used so they
# cannot seed their own centroids. Kills "shadow" wiggles next to real peaks.
# Set window to 0.0 to disable.
bruker_satellite_window_da = 0.15
bruker_satellite_end_fraction = 0.3

# Per-frame iterative MAD noise filter applied to the centroided peaks before
# the Bruker reader emits a Spectrum. Same algorithm as `noise_filter_sigma`
# (below) but runs earlier and independently. Drops peaks whose intensity is
# below median + sigma * (1.4826 * MAD) of the noise floor. Lower = more
# aggressive. Omit to disable.
# bruker_noise_sigma = 3.0

# Per-scan iterative noise filter. Estimates the noise floor by iteratively
# sigma-clipping signal peaks, then discards any peak below
# median + sigma * (1.4826 * MAD) of the noise. Omit to disable.
# Typical starting value: 3.0. Lower = more aggressive filtering.
# noise_filter_sigma = 3.0

# Also detect MS2 hills, one channel per precursor isolation window
# (DIA). Writes a second `hills_ms2.{tsv|parquet}` file alongside the MS1
# hills. mzML only — Bruker .d MS2 frames are not yet supported.
# Can also be enabled at the command line with --ms2.
ms2_hills_enabled = true

[hills]
# Minimum number of scans a hill must span
min_scans = 3
# Maximum gap (in scans) allowed within a hill
max_gap = 0

# Whether to split hills at local minima
split_hills = true
# Minimum scan distance between peaks when splitting
min_peak_distance = 10
# Minimum peak height relative to the tallest peak (0.0–1.0)
min_peak_height = 0.2
# Minimum peak prominence required to trigger a split (fraction of the hill's
# maximum intensity, 0.0–1.0). Prominence measures how much a peak stands above
# the highest valley between it and any taller neighbour. Noise wiggles on a
# peak's flank have near-zero prominence and will not cause spurious splits.
min_prominence = 0.2

# Weight for the intensity log₂-fold-change term in the hill-candidate distance
# score. When multiple peaks fall within the m/z tolerance window, this biases
# selection toward the peak whose intensity is most consistent with the hill's
# last observed intensity, reducing noise-peak capture. 0.0 disables it.
# For data with a lot of noisy peaks, like timsTOF PASEF, a value around 0.5 can help. 
lfc_weight = 0.5

# Smooth hill intensity profiles after finalization using a running average.
# Reduces scan-to-scan noise before cosine similarity and scoring.
# Disabled by default; enable for noisy data.
smoothing_enabled = false
# Half-width of the smoothing window. Total window = 2 * smoothing_window + 1 scans.
# 0 = gap-fill only (no averaging). Ignored when smoothing_enabled is false.
smoothing_window = 1

[features]
# Charge state range to consider
min_charge = 1
max_charge = 7

# Per-extension threshold (CHROMATOGRAPHIC cosine, in scan/RT space) used
# while building an isotope chain. A candidate hill's cosine vs the seed hill
# must clear this to extend the chain. NOT a final-quality filter — see the
# three score thresholds below for that.
min_chain_cosine = 0.5

# Maximum allowed intensity decrease on the left/right flanks (0.0–1.0)
left_max_decrease = 0.05
right_max_decrease = 0.05

# Maximum number of isotope peaks to consider
max_isotopes = 6

# C13 neutron mass in Da (rarely needs changing)
neutron_mass = 1.003354835

# Post-scoring feature retention filters. Three AND-ed thresholds:
#   isotope_score  — Bhattacharyya match vs averagine isotope pattern
#   cosine_score   — mean chromatographic cosine between adjacent isotope hills
#   combined_score — isotope_score × cosine_score
# 0.0 = keep all. Use combined_score alone for the simplest quality knob,
# or split when you want to gate on isotope quality and co-elution separately.
min_isotope_score = 0.0
min_cosine_score  = 0.0
min_combined_score = 0.0

[scoring]
# Range of neutron offsets to evaluate for monoisotopic peak reassignment
isotope_offset_min = -1
isotope_offset_max = 1

# Score bonus added to the Bhattacharyya score when offset == 0, to prefer
# the no-reassignment hypothesis when scores are close. Internal only.
offset_zero_bonus = 0.15

# Features whose best Bhattacharyya (isotope_score) is below this keep
# neutron_offset = 0 (no monoisotopic reassignment). Does not affect feature
# retention — use [features] min_isotope_score / min_cosine_score / min_combined_score.
min_isotope_score_for_offset = 0.5
