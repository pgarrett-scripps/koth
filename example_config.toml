# koth_ff example configuration
# All values shown are defaults. Uncomment and modify as needed.
# Usage: koth_ff <input> --config example_config.toml
[output]
format = "tsv"

[file]
# m/z tolerance — used by both hill detection and feature finding
mz_tolerance = 8.0
# "ppm" or "da"
mz_tolerance_type = "ppm"

# Ion mobility tolerance — used by both hill detection and feature finding
im_tolerance = 0.05
# "relative" (fraction of IM value) or "absolute" (1/K0 units)
im_tolerance_type = "relative"

# Restrict processing to this m/z window. Both are optional — omit to apply no
# bound. Defaults: global_min_mz = 0.0, global_max_mz = +inf (no upper limit).
# global_min_mz = 0.0
# global_max_mz = inf

# Fraction of total hill intensity to retain (1.0 = keep all scans)
intensity_coverage = 1.0

# Number of threads (omit or set to 0 to use all available CPUs)
# n_threads = 8

# Bruker .d pipeline: vertical-IM filter (Stage 1) + watershed centroider
# (Stage 3). Tolerances are in integer TOF-index and scan-number units —
# everything runs on the raw integer cloud before m/z / 1/K0 conversion.

# Stage 1: vertical-IM feature filter. Walks each TOF column, sums intensities
# across the ±half_width window into a per-scan profile, finds runs of
# "occupied" scans (with internal-gap closing), and keeps only points whose
# scan falls in a run that clears both the length and total-intensity floors.
# Each pass re-applies the filter to the prior pass's survivors.
bruker_filter_mz_half_width = 2       # TOF-index half-width of the column window
bruker_filter_max_internal_gap = 1    # max consecutive empty scans tolerated inside a run
bruker_filter_min_feature_length = 5  # minimum kept-run span (gap-inclusive), in scans
bruker_filter_min_window_intensity = 0     # per-scan summed-intensity floor for "occupied"
bruker_filter_min_feature_intensity = 0    # total summed intensity over the run span
bruker_filter_num_iterations = 1      # how many passes to run

# Stage 3: watershed centroider. Processes points in descending intensity
# order; each point joins the group of its nearest in-box assigned neighbour
# (Manhattan distance, ±box_scan × ±box_mz_idx). Points with no in-box
# neighbour become new seeds iff their intensity >= min_seed_intensity;
# otherwise they are dropped as orphans. Centroids whose group total falls
# below min_centroid_total are discarded.
bruker_watershed_box_scan = 10        # nearest-neighbour reach (scans)
bruker_watershed_box_mz_idx = 3       # nearest-neighbour reach (TOF indices)
bruker_watershed_min_seed_intensity = 0
bruker_watershed_min_centroid_total = 0
# Hard cap on how far (TOF-index units) any group member can sit from that
# group's seed. Prevents a long follower chain from extending past the real
# peak's TOF edge. ±10 indices is a sensible default for typical timsTOF data.
bruker_watershed_max_tof_offset = 10

# Per-frame iterative MAD noise filter applied to the centroided peaks before
# the Bruker reader emits a Spectrum. Same algorithm as `noise_filter_sigma`
# (below) but runs earlier and independently. Drops peaks whose intensity is
# below median + sigma * (1.4826 * MAD) of the noise floor. Lower = more
# aggressive. Omit to disable.
# bruker_noise_sigma = 3.0

# Per-scan iterative noise filter. Estimates the noise floor by iteratively
# sigma-clipping signal peaks, then discards any peak below
# median + sigma * (1.4826 * MAD) of the noise. Omit to disable.
# Typical starting value: 3.0. Lower = more aggressive filtering.
# noise_filter_sigma = 3.0

# Also detect MS2 hills, one channel per precursor isolation window
# (DIA). Writes a second `hills_ms2.{tsv|parquet}` file alongside the MS1
# hills. mzML only — Bruker .d MS2 frames are not yet supported.
# Can also be enabled at the command line with --ms2.
ms2_hills_enabled = true

# ID-free isotope-consistency m/z recalibration (Biosaur-style). A pass-1
# feature detection collects the signed ppm deviation of every adjacent
# isotope-hill spacing from its theoretical neutron/z step and bins the
# residuals over (m/z, RT). Pass 2 shifts the *expected* isotope position
# during chain extension by the learned per-region median offset, so isotope
# hills are searched for at their recalibrated location. Corrects the
# proportional, m/z-/RT-dependent component of the mass error (the dominant
# Orbitrap mode); a constant Da offset is unobservable without IDs/lock mass.
# Skipped in decoy mode and when too few isotope-spacing samples are collected.
# Costs one extra (cheap) feature-assembly pass over the same hills.
# mz_recalibration = false
# mz_recalibration_mz_bins = 20
# mz_recalibration_rt_bins = 8
# mz_recalibration_min_samples = 50

# When mz_recalibration is enabled it also makes the isotope-match tolerance
# region-adaptive, built on the surface above: instead of a fixed ppm window,
# use clamp(tol_sigma_mult × σ(m/z,RT), tol_floor_ppm, mz_tolerance), where σ is
# the surface's per-region residual spread. This is the part that actually moves
# numbers — position-only recalibration alone was a no-op on both benchmark
# platforms, but sizing the isotope-match window to the instrument's real local
# precision was a win on both: PXD003881 (Orbitrap, fixed 8 ppm vs learned
# σ≈0.9 ppm) drops -5.8% spurious features at flat recall with better CV/MV; a
# 15-min timsTOF cohort (fixed 15 ppm vs learned σ≈2.8 ppm) gains +1.06 pp PSM
# recall AND better CV/MV. No regression found on either platform. Only honoured
# for ppm tolerances.
# mz_recalibration_tol_sigma_mult = 4.0
# mz_recalibration_tol_floor_ppm = 1.0

[hills]
# Minimum number of scans a hill must span
min_scans = 3
# Maximum gap (in scans) allowed within a hill
max_gap = 0

# Whether to split hills at co-eluting local minima (persistence splitter:
# despike + smooth + robust-max threshold + valley merge). The `split_*` knobs
# below tune it; all have defaults, so they may be omitted.
split_hills = true
# split_valley_ratio = 0.70   # valley must drop to <= this fraction of the smaller peak
# split_sigma_mult   = 4.0    # absolute notch depth floor, in noise sigma
# split_height_frac  = 0.10   # min peak height as a fraction of the robust (95th-pct) max

# Weight for the intensity log₂-fold-change term in the hill-candidate distance
# score. When multiple peaks fall within the m/z tolerance window, this biases
# selection toward the peak whose intensity is most consistent with the hill's
# last observed intensity, reducing noise-peak capture. 0.0 disables it.
# For data with a lot of noisy peaks, like timsTOF PASEF, a value around 0.5 can help. 
lfc_weight = 0.5

# Linear-interpolate intensity through internal zero-gap scans during hill
# finalization. Independent of `smoothing_enabled`. Default false.
# NOTE: turning this on can create artificial local maxima that the
# split-hills logic picks up as new peaks — it materially increases final
# hill count on data with many short gaps (timsTOF DDA in particular).
gap_fill_enabled = false

# Apply a running-average filter to the hill intensity profile after
# finalization. Reduces scan-to-scan noise before cosine similarity and
# scoring. Independent of `gap_fill_enabled`. Default false.
smoothing_enabled = false
# Half-width of the smoothing window. Total window = 2 * smoothing_window + 1 scans.
# 0 = no averaging. Ignored when smoothing_enabled is false.
smoothing_window = 1

# Drop "large baseline-like" hills before isotope-chain assembly. Inspired by
# AlphaPept's filter_hills / check_large_hills. A hill is dropped when its scan
# span >= large_hill_min_scans AND its unsmoothed max isn't >= large_hill_peak_factor
# times the smoothed intensity at *both* endpoints — i.e., the profile lacks a
# clear chromatographic apex. Catches column-bleed contaminants, plasticizers,
# and baseline-drift centroids that masquerade as hills. Default off for
# backward compatibility; flip on with `--filter-baseline-hills` to test.
# filter_large_baseline_hills = false
# large_hill_min_scans = 40
# large_hill_peak_factor = 2.0

# Optional separate hill-detection settings for MS2 (DIA fragment) scans,
# used only when `[file].ms2_hills_enabled = true`. OVERRIDE semantics: MS2
# hill detection starts from `[hills]` above and applies ONLY the fields you
# set here; every field you omit is inherited from `[hills]` (NOT reset to a
# built-in default). If this whole table is absent, MS2 hills use `[hills]`
# unchanged. Example: fragment traces are often shorter than precursor traces,
# so relax `min_scans` for MS2 only while keeping all other `[hills]` settings:
# [hills_ms2]
# min_scans = 2

[features]
# Charge state range to consider
min_charge = 1
max_charge = 7

# Per-extension threshold (CHROMATOGRAPHIC cosine, in scan/RT space) used
# while building an isotope chain. A candidate hill's cosine vs the seed hill
# must clear this to extend the chain. NOT a final-quality filter — see the
# three score thresholds below for that.
min_chain_cosine = 0.5

# Maximum allowed intensity decrease on the left/right flanks (0.0–1.0)
right_max_decrease = 0.05

# Maximum number of isotope peaks to consider
max_isotopes = 6

# Per-extension intensity-ratio gate. After a candidate hill clears
# `min_chain_cosine`, also check that its apex intensity vs the predecessor's
# matches the averagine ratio within ± this many log2 units. Catches
# column-bleed / contaminant hills that co-elute (so pass cosine) but have
# wrong intensity for an isotope. 1.5 ≈ within 2.83× of expected.
# Set very large (e.g. 100) to effectively disable.
max_isotope_log2_ratio = 1.5

# C13 neutron mass in Da (rarely needs changing)
neutron_mass = 1.003354835

# Post-scoring feature retention filters. Three AND-ed thresholds:
#   isotope_score  — Bhattacharyya match vs averagine isotope pattern
#   cosine_score   — mean chromatographic cosine between adjacent isotope hills
#   combined_score — isotope_score × cosine_score
# 0.0 = keep all. Use combined_score alone for the simplest quality knob,
# or split when you want to gate on isotope quality and co-elution separately.
min_isotope_score = 0.0
min_cosine_score  = 0.0
min_combined_score = 0.0

[scoring]
# Whether to evaluate the ±1 neutron-offset monoisotopic peak reassignment.
# false = test only offset 0 (no reassignment); true = search offsets [-1, +1].
isotope_offset_enabled = true

# Score bonus added to the Bhattacharyya score when offset == 0, to prefer
# the no-reassignment hypothesis when scores are close. Internal only.
offset_zero_bonus = 0.15

# Features whose best Bhattacharyya (isotope_score) is below this keep
# neutron_offset = 0 (no monoisotopic reassignment). Does not affect feature
# retention — use [features] min_isotope_score / min_cosine_score / min_combined_score.
min_isotope_score_for_offset = 0.5
