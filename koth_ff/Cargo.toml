[package]
name             = "koth_ff"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description      = "High-performance LC-MS feature finder for timsTOF and mzML data"

[[bin]]
name = "koth_ff"
path = "src/main.rs"

[[bin]]
name = "koth_align"
path = "src/align_main.rs"

[lib]
name = "koth_ff"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
mzdata     = { workspace = true }
flate2     = "1"
timsrust   = { workspace = true, optional = true }
rayon      = { workspace = true }
csv        = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }
log        = { workspace = true }
env_logger = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
clap       = { workspace = true }
arrow      = { workspace = true }
parquet    = { workspace = true }
rand       = { workspace = true }

[features]
default = ["tdf"]
tdf = ["timsrust"]
