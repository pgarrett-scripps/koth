[package]
name             = "koth_ff"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
authors          = ["Patrick Garrett <pgarrett@scripps.edu>"]
description      = "High-performance LC-MS feature finder for timsTOF and mzML data"
default-run      = "koth_ff"
readme           = "../README.md"
homepage         = "https://github.com/tacular-omics/koth_rust"
documentation    = "https://docs.rs/koth_ff"
keywords         = ["mass-spectrometry", "proteomics", "lc-ms", "timstof", "feature-detection"]
categories       = ["science", "command-line-utilities"]

[lints]
workspace = true

[[bin]]
name = "koth_ff"
path = "src/main.rs"

[[bin]]
name = "koth_align"
path = "src/align_main.rs"

[lib]
name = "koth_ff"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
mzdata     = { workspace = true }
flate2     = "1"
timsrust   = { workspace = true, optional = true }
dnoise     = { version = "0.4.0", default-features = false, optional = true }
rusqlite   = { version = "0.32", features = ["bundled"], optional = true }
# Native Thermo .raw reading: a pure-Rust parser of the .raw binary format (no
# .NET runtime, no vendor assemblies, no system libraries), so a `.raw` file can
# be fed to koth_ff directly with no prior mzML conversion.
opentfraw  = { version = "1.4", optional = true }
rayon      = { workspace = true }
csv        = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }
log        = { workspace = true }
env_logger = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
clap       = { workspace = true }
arrow      = { workspace = true }
parquet    = { workspace = true }
rand       = { workspace = true }
rustc-hash = "1"
sha2 = "0.10"

[[example]]
name = "tims_mobility_dump"
required-features = ["tdf"]

[features]
default = ["tdf", "thermo"]
tdf = ["dep:timsrust", "dep:dnoise", "dep:rusqlite"]
# Native Thermo Fisher .raw input (no mzML conversion). Pure Rust, on by default;
# `--no-default-features --features tdf` builds without it.
thermo = ["dep:opentfraw"]

[package.metadata.docs.rs]
features = ["tdf", "thermo"]
rustdoc-args = ["--cfg", "docsrs"]
