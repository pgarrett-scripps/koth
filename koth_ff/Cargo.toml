[package]
name = "koth_ff"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "koth_ff"
path = "src/main.rs"

[lib]
name = "koth_ff"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
mzdata     = { workspace = true }
timsrust   = { workspace = true, optional = true }
rayon      = { workspace = true }
csv        = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
toml       = { workspace = true }
log        = { workspace = true }
env_logger = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
clap       = { workspace = true }

[features]
default = ["tdf"]
tdf = ["timsrust"]
